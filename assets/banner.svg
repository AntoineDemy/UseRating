<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="jf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#AA5CC3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#AA5CC3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#00A4DC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00A4DC" stop-opacity="0"/>
    </radialGradient>
    <path id="star" d="M0,-1 L0.2245,-0.309 L0.9511,-0.309 L0.3633,0.118 L0.5878,0.809 L0,0.382 L-0.5878,0.809 L-0.3633,0.118 L-0.9511,-0.309 L-0.2245,-0.309 Z"/>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow1)"/>
  <rect width="1280" height="400" fill="url(#glow2)"/>

  <!-- faint decorative stars -->
  <g fill="#ffffff" opacity="0.06">
    <use href="#star" transform="translate(600 60) scale(22)"/>
    <use href="#star" transform="translate(1220 70) scale(30)"/>
    <use href="#star" transform="translate(560 350) scale(16)"/>
    <use href="#star" transform="translate(40 360) scale(26)"/>
  </g>

  <!-- left: logo + title -->
  <g transform="translate(80 0)">
    <g transform="translate(48 132)">
      <circle r="48" fill="url(#jf)"/>
      <use href="#star" fill="#ffffff" transform="scale(28) translate(0 0.06)"/>
    </g>
    <text x="0" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">User Ratings</text>
    <text x="2" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#c7d0e0">Rate, review &amp; discover with everyone on your server</text>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
      <rect x="0" y="318" width="132" height="32" rx="16" fill="#AA5CC3" fill-opacity="0.18" stroke="#AA5CC3" stroke-opacity="0.6"/>
      <text x="66" y="339" text-anchor="middle" fill="#e2c6ef">Jellyfin 10.9+</text>
      <rect x="144" y="318" width="102" height="32" rx="16" fill="#00A4DC" fill-opacity="0.18" stroke="#00A4DC" stroke-opacity="0.6"/>
      <text x="195" y="339" text-anchor="middle" fill="#bfe9f8">Web UI</text>
      <rect x="258" y="318" width="80" height="32" rx="16" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-opacity="0.5"/>
      <text x="298" y="339" text-anchor="middle" fill="#fff0a0">MIT</text>
    </g>
  </g>

  <!-- right: mock rating card -->
  <g transform="translate(760 56)" filter="url(#shadow)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect width="440" height="288" rx="14" fill="#151b28" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="28" y="48" font-size="22" fill="#ffffff">User Ratings</text>
    <use href="#star" fill="#ffd700" transform="translate(178 41) scale(10)"/>
    <text x="194" y="48" font-size="22" fill="#ffd700">4.3 (3 ratings)</text>

    <g fill="#ffd700">
      <use href="#star" transform="translate(44 94) scale(16)"/>
      <use href="#star" transform="translate(84 94) scale(16)"/>
      <use href="#star" transform="translate(124 94) scale(16)"/>
      <use href="#star" transform="translate(164 94) scale(16)"/>
    </g>
    <use href="#star" fill="#ffffff" fill-opacity="0.15" transform="translate(204 94) scale(16)"/>
    <rect x="300" y="78" width="112" height="34" rx="17" fill="#00A4DC"/>
    <text x="356" y="101" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Post rating</text>

    <line x1="28" x2="412" y1="132" y2="132" stroke="#ffffff" stroke-opacity="0.08"/>

    <g>
      <rect x="28" y="146" width="384" height="58" rx="8" fill="#ffffff" fill-opacity="0.04"/>
      <circle cx="52" cy="175" r="13" fill="#AA5CC3"/>
      <text x="52" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">D</text>
      <text x="76" y="171" font-size="16" fill="#ffffff">david</text>
      <text x="124" y="171" font-size="14" fill="#ffd700">★★★★★</text>
      <text x="76" y="192" font-size="14" fill="#c7d0e0">Instant classic. Movie night pick!</text>
      <text x="400" y="171" text-anchor="end" font-size="12" fill="#7d879a">Nov 1</text>
    </g>
    <g>
      <rect x="28" y="214" width="384" height="58" rx="8" fill="#ffffff" fill-opacity="0.04"/>
      <circle cx="52" cy="243" r="13" fill="#00A4DC"/>
      <text x="52" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">S</text>
      <text x="76" y="239" font-size="16" fill="#ffffff">sarah</text>
      <text x="124" y="239" font-size="14" fill="#ffd700">★★★★<tspan fill="#ffffff" fill-opacity="0.2">★</tspan></text>
      <text x="76" y="260" font-size="14" fill="#c7d0e0">Great soundtrack, slow middle act.</text>
      <text x="400" y="239" text-anchor="end" font-size="12" fill="#7d879a">Oct 29</text>
    </g>
  </g>
</svg>
